spring.application.name=travel-crm-backend

# Stateless JWT only - no session, no UserDetailsService lookup on the hot path (blueprint
# §4.1). Without this exclusion Spring Boot's default auto-config generates and logs an
# unused in-memory user/password on every startup.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Database ---
# search_path is overridden per-request by TenantSchemaDataSource; this default only
# matters for the very first connection before any tenant context is set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voyra_crm_dev}
spring.datasource.username=${DB_USERNAME:voyra}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari: short max-lifetime keeps pooled connections from drifting away from the
# tenant search_path set on borrow; conservative pool size for local dev.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000

# Hibernate never owns the schema - Flyway does. Tenant tables live in dynamic
# schemas that Hibernate cannot validate at startup.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway (public schema only; tenant schemas run programmatically) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Password encryption (reversible AES, used only for agent credential retrieval) ---
app.security.password-encryption-key=${PASSWORD_ENCRYPTION_KEY}

# --- Public proposal share links ---
app.public-proposal.base-url=${PUBLIC_PROPOSAL_BASE_URL:http://localhost:3000/proposal}
# Share links expire after this many days. Enforced in PublicProposalService.resolveLink().
app.public-proposal.validity-days=${PUBLIC_PROPOSAL_VALIDITY_DAYS:90}

# --- Public feedback share links ---
app.public-feedback.base-url=${PUBLIC_FEEDBACK_BASE_URL:http://localhost:3000/feedback}
app.public-feedback.validity-days=${PUBLIC_FEEDBACK_VALIDITY_DAYS:90}

# --- File storage ---
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:./uploads}

# --- Flight supplier search ---
# TESTING BRANCH: pinned to "mock" (ignores FLIGHT_SUPPLIER) so client demos always show
# plausible generated offers, regardless of the Tripjack UAT key's live status. Revert to
# ${FLIGHT_SUPPLIER:mock} - i.e. merge from phase1 - once Tripjack access is sorted.
app.flight-supplier.provider=mock

# --- Hotel supplier search ---
# TESTING BRANCH: same pin as flight supplier above, for the same demo-reliability reason.
app.hotel-supplier.provider=mock

# --- CORS ---
# Comma-separated explicit origin allowlist. Never "*" - allowCredentials is true (§4.6).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Demo seeding (LOCAL ONLY) ---
# Creates a known-password SUPER_ADMIN. Must never be true outside local development.
app.seed.demo-data=${SEED_DEMO_DATA:false}

# --- Platform admin seed (safe for every environment, including production) ---
# Optional: idempotent, skipped entirely when either is unset. See PlatformAdminSeedRunner.
app.seed.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.seed.super-admin.password=${SUPER_ADMIN_PASSWORD:}

server.port=${PORT:${SERVER_PORT:8080}}

# --- File upload limits (customer/family documents: PDF/JPG/PNG up to 10MB, matches UI copy) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator (Cloud Run startup/liveness probes) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Tenant catch-up migration on boot. Safe to run concurrently (Flyway takes a Postgres
# advisory lock per schema) but costly on autoscaled instances - run it on a dedicated
# migration job or a min-instance, not on every cold start.
app.migration.run-tenant-catchup-on-startup=${RUN_TENANT_MIGRATIONS:true}

logging.level.com.voyra.crm=${LOG_LEVEL:INFO}
