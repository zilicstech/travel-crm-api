# Pool size from DB_POOL_SIZE (default 10): instances x DB_POOL_SIZE (x2 during a rolling deploy)
# must stay under the database's connection limit. max-lifetime is kept well under Cloud SQL's
# idle timeout so connections are recycled before the server drops them mid-request.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000

logging.level.com.voyra.crm=INFO

# Never simulate payments on a deployed instance, even while the stub provider is active.
app.payments.simulate-enabled=false
